# 모든 서비스의 관측 기본값(ObservabilityEnvironmentPostProcessor가 가장 낮은 우선순위로 붙임).
# 컨테이너에서는 Dockerfile의 MANAGEMENT_SERVER_PORT=9091로 actuator가 관리 포트에 따로 뜬다(nginx가 넘기지 않음).
# 로컬 bootRun은 앱 포트에 뜬다(앱 7개가 같은 포트를 두고 충돌하지 않게).

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# 전체 히스토그램 대신 버킷 6개(시계열 수를 줄임)
management.metrics.distribution.slo.http.server.requests=50ms,100ms,300ms,500ms,1s,3s
