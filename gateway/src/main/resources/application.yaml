server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    # 로컬 실행 때 레포 루트의 .env(JWT_SECRET 등)를 읽는다. 다른 서비스와 같은 방식
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000   # ms. 서비스 컨테이너가 꺼져 있으면 오래 붙잡지 않고 실패시킨다
            response-timeout: 60s   # 토스 응답 대기(30초)보다 길게. 지금 nginx proxy_read_timeout과 같다
          # 서비스별 경로 규칙. nginx(infra/nginx/default.conf)가 하던 경로 나누기를 옮겼다.
          # 위에서부터 고르므로 더 좁은 경로를 위에 둔다. 서비스는 포트 순서(member 8081 → … → ai 8087)로 적는다.
          # `/x/**`는 `/x` 자체와 그 아래를 모두 고른다.
          # /internal/**(서비스 간 호출)은 규칙을 만들지 않는다 → 밖에서 부르면 404 (docs/palette_shared_contract.md)
          # 규칙에 없는 경로도 404다. 새 API 경로를 만들면 여기에 같이 추가한다.
          # /v3/api-docs/{서비스}는 그 서비스의 /v3/api-docs로 바꿔 넘긴다 (Swagger 화면의 서비스 선택 드롭다운이 읽는다)
          routes:
            # 내 쿠폰 사용 내역은 users/ 아래지만 쿠폰 데이터가 market에 있어 member 규칙보다 먼저 고른다
            - id: market-coupon-usages
              uri: ${MARKET_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/me/coupon-usages/**

            # 인증·회원·판매자·인플루언서 (판매자 본인 정보, 판매자의 인플루언서 검색, 관리자 회원·판매자·인플루언서 관리 포함)
            - id: member
              uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/sellers/**,/api/v1/seller/me/**,/api/v1/seller/influencers/**,/api/v1/influencers/**,/api/v1/admin/users/**,/api/v1/admin/sellers/**,/api/v1/admin/influencers/**,/v3/api-docs/member
              filters:
                - RewritePath=^/v3/api-docs/member$, /v3/api-docs

            # 상품, 카테고리, 장바구니, 주문(관리자 반품 포함), 찜, 리뷰, 쿠폰, 협약 (판매자, 인플루언서, 관리자용 포함), 상품 이미지
            # influencer/(단수, 인플루언서 전용)는 market이고, influencers/(복수, 신청·검색)는 member다
            - id: market
              uri: ${MARKET_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/cart/**,/api/v1/orders/**,/api/v1/wishlist/**,/api/v1/reviews/**,/api/v1/coupons/**,/api/v1/influencer/**,/api/v1/seller/products/**,/api/v1/seller/order-items/**,/api/v1/seller/partnerships/**,/api/v1/seller/coupons/**,/api/v1/admin/products/**,/api/v1/admin/categories/**,/api/v1/admin/product-stop-requests/**,/api/v1/admin/coupons/**,/api/v1/admin/partnerships/**,/api/v1/admin/returns/**,/images/**,/v3/api-docs/market
              filters:
                - RewritePath=^/v3/api-docs/market$, /v3/api-docs

            # 예치금 지갑·충전, 반품 환불(회수 택배비 결제), 관리자 결제·충전 조회
            # /v3/api-docs(서비스 이름 없이)는 scripts/deploy.sh의 배포 확인이 부른다 (nginx 시절 기본 대상이 payment였다)
            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/wallet/**,/api/v1/topups/**,/api/v1/payments/**,/api/v1/admin/payments/**,/api/v1/admin/topups/**,/v3/api-docs,/v3/api-docs/payment
              filters:
                - RewritePath=^/v3/api-docs/payment$, /v3/api-docs

            # 관리자 정산·정산 후보, 판매자 정산 조회
            - id: settlement
              uri: ${SETTLEMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/admin/settlements/**,/api/v1/admin/settlement-candidates/**,/api/v1/seller/settlements/**,/v3/api-docs/settlement
              filters:
                - RewritePath=^/v3/api-docs/settlement$, /v3/api-docs

            # 물류 담당자의 배송 조회·송장, 관리자 배송 목록·수동 완료, Delivery Tracker 웹훅
            # 웹훅 주소 끝은 비밀 토큰이다. gateway는 접근 로그를 남기지 않으므로 토큰이 로그에 찍히지 않는다
            - id: delivery
              uri: ${DELIVERY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/logistics/**,/api/v1/admin/deliveries/**,/webhooks/delivery-tracker/**,/v3/api-docs/delivery
              filters:
                - RewritePath=^/v3/api-docs/delivery$, /v3/api-docs

            # 구매자 알림 목록·안 읽은 개수·읽음 처리
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**,/v3/api-docs/notification
              filters:
                - RewritePath=^/v3/api-docs/notification$, /v3/api-docs

            # 뷰티 설문, 맞춤 상품·크리에이터 추천, FAQ·챗봇, 관리자 FAQ 관리
            - id: ai
              uri: ${AI_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/ai/**,/api/v1/admin/faqs/**,/v3/api-docs/ai
              filters:
                - RewritePath=^/v3/api-docs/ai$, /v3/api-docs

custom:
  jwt:
    # 서비스와 같은 서명 키. 기본값 없이 환경변수(.env)로만 주입한다
    secret: ${JWT_SECRET}
